# Promptly — CI pipeline
#
# Runs on every push and pull request to main/master.
# What it does:
#   1. Sets up JDK 17
#   2. Sets up Android SDK + installs required packages explicitly
#   3. Caches Gradle dependencies + wrapper (massive speedup on subsequent runs)
#   4. Runs `./gradlew assembleDebug`        — confirms the project compiles
#   5. Runs `./gradlew lintDebug`            — Android lint, fails on serious issues
#   6. Runs `./gradlew testDebugUnitTest`    — unit tests (we don't have any yet,
#                                              but the target will pass trivially)
#   7. Uploads the built APK as a downloadable artifact (kept for 14 days)

name: CI

on:
  push:
    branches: [ main, master ]
    # Don't trigger CI on tag pushes — release.yml handles those.
    tags-ignore: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

# Cancel in-progress runs for the same branch when a new commit lands
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Gradle wrapper JAR if missing
        run: gradle wrapper --gradle-version 8.10.2 --distribution-type bin

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain --stacktrace

      - name: Run lint
        run: ./gradlew lintDebug --console=plain
        continue-on-error: true   # lint warnings shouldn't fail CI in v1

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain
        continue-on-error: true   # no tests yet — will be a no-op

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: promptly-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*.html
          retention-days: 7
          if-no-files-found: ignore
