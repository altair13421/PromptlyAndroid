# Promptly — Release pipeline (GitHub Releases)
#
# Triggers automatically when a `v*` tag is pushed.
# What it does:
#   1. Sets up JDK 17 + Android SDK 35
#   2. Decodes the PROMPTLY_KEYSTORE_BASE64 secret back into a .jks file
#   3. Sets env vars from secrets so Gradle can sign the release
#   4. Runs ./gradlew assembleRelease        — produces the signed APK
#   5. Either:
#        a. The release was already created by scripts/release.sh → upload APK to it
#        b. No release exists yet → create one with auto-generated notes
#   6. Uploads the APK + R8 mapping.txt as release assets
#
# Required GitHub repo secrets:
#   PROMPTLY_KEYSTORE_BASE64   — base64-encoded .jks file
#   PROMPTLY_STORE_PASSWORD    — keystore password
#   PROMPTLY_KEY_ALIAS         — key alias (e.g. "promptly")
#   PROMPTLY_KEY_PASSWORD      — key password
#
# See RELEASE.md → "One-time setup" for how to generate these.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

# Release runs are NOT cancellable — if a tag was pushed, the user wants the APK.
# Sequential runs are fine (multiple tags pushed at once is rare).

jobs:
  build-and-release:
    name: Build signed APK + publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Gradle wrapper JAR if missing
        run: gradle wrapper --gradle-version 8.10.2 --distribution-type bin

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PROMPTLY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::PROMPTLY_KEYSTORE_BASE64 secret not set — building UNSIGNED release."
            exit 0
          fi
          mkdir -p ~/.android/keystores
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/keystores/promptly-release.jks
          echo "Keystore decoded."

      - name: Build release APK
        env:
          PROMPTLY_STORE_FILE: ${{ secrets.PROMPTLY_KEYSTORE_BASE64 != '' && '/home/runner/.android/keystores/promptly-release.jks' || '' }}
          PROMPTLY_STORE_PASSWORD: ${{ secrets.PROMPTLY_STORE_PASSWORD }}
          PROMPTLY_KEY_ALIAS: ${{ secrets.PROMPTLY_KEY_ALIAS }}
          PROMPTLY_KEY_PASSWORD: ${{ secrets.PROMPTLY_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain --stacktrace

      - name: Verify APK exists
        run: |
          APK_DIR="app/build/outputs/apk/release"
          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print)
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release APK in $APK_DIR; found ${#APKS[@]}."
            ls -la "$APK_DIR"
            exit 1
          fi
          APK="${APKS[0]}"
          ls -lh "$APK"
          echo "APK_PATH=$APK" >> $GITHUB_ENV

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: promptly-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload mapping file
        uses: actions/upload-artifact@v4
        with:
          name: promptly-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$RELEASE_TAG"
          APK="$APK_PATH"
          MAPPING="app/build/outputs/mapping/release/mapping.txt"

          # If a release already exists for this tag (e.g. created locally by
          # scripts/release.sh), upload assets to it. Otherwise create one.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets"
            gh release upload "$TAG" "$APK" --clobber
            [ -f "$MAPPING" ] && gh release upload "$TAG" "$MAPPING" --clobber
          else
            echo "Creating release $TAG"
            ASSETS=("$APK")
            [ -f "$MAPPING" ] && ASSETS+=("$MAPPING")
            gh release create "$TAG" \
              "${ASSETS[@]}" \
              --title "$TAG" \
              --generate-notes
          fi

          echo ""
          echo "Release published: https://github.com/${{ github.repository }}/releases/tag/$TAG"
